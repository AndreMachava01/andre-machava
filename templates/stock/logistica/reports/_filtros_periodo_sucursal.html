<form method="get" class="filters-row">
    <div class="filter-group">
        <label class="filter-label" for="filtro-data-inicio">Data início</label>
        <input type="date" id="filtro-data-inicio" name="data_inicio" class="form-control"
               value="{{ data_inicio }}" required>
    </div>
    <div class="filter-group">
        <label class="filter-label" for="filtro-data-fim">Data fim</label>
        <input type="date" id="filtro-data-fim" name="data_fim" class="form-control"
               value="{{ data_fim }}" required>
    </div>
    {% if sucursais_permitidas|length > 1 %}
    <div class="filter-group">
        <label class="filter-label" for="filtro-sucursal">Sucursal</label>
        <select id="filtro-sucursal" name="sucursal" class="form-select">
            <option value="">Todas</option>
            {% for sucursal in sucursais_permitidas %}
            <option value="{{ sucursal.id }}" {% if sucursal_selecionada == sucursal.id %}selected{% endif %}>
                {{ sucursal.nome }}
            </option>
            {% endfor %}
        </select>
    </div>
    {% endif %}
    <div class="filter-group filter-group--actions">
        <span class="filter-label filter-label--actions" aria-hidden="true">Ações</span>
        <div class="filter-actions">
            <button type="submit" class="btn-search">
                <i class="fas fa-search" aria-hidden="true"></i>
                Filtrar
            </button>
            <a href="?" class="btn-clear">
                <i class="fas fa-times" aria-hidden="true"></i>
                Limpar
            </a>
        </div>
    </div>
</form>
