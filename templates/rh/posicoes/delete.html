<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Posição</title>
    <style>
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f9fa;padding:20px}
        .container{max-width:600px;margin:0 auto;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
        .header{padding:20px;border-bottom:2px solid #ef4444}
        .header h1{margin:0;font-size:20px}
        .content{padding:20px}
        .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
        .btn{padding:8px 14px;border-radius:4px;text-decoration:none;color:#fff;background:#ef4444;border:none}
        .btn-secondary{background:#6c757d}
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Excluir Posição</h1>
    </div>
    <div class="content">
        <p>Tem certeza que deseja excluir a posição <strong>{{ posicao.nome }}</strong> do departamento <strong>{{ posicao.departamento.nome }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <div class="actions">
                <a href="{% url 'rh:posicoes' %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn">Excluir</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
