<nav class="breadcrumb-modern" aria-label="Navegação">
    <a href="{% url 'dashboard' %}"><i class="fas fa-home" aria-hidden="true"></i> Dashboard</a>
    <i class="fas fa-chevron-right" aria-hidden="true"></i>
    <a href="{% url 'rh:main' %}">RH</a>
    {% if breadcrumb_section %}
    <i class="fas fa-chevron-right" aria-hidden="true"></i>
    {% if breadcrumb_section_url %}
    <a href="{{ breadcrumb_section_url }}">{{ breadcrumb_section }}</a>
    {% else %}
    <span>{{ breadcrumb_section }}</span>
    {% endif %}
    {% endif %}
    {% if breadcrumb_current %}
    <i class="fas fa-chevron-right" aria-hidden="true"></i>
    <span>{{ breadcrumb_current }}</span>
    {% endif %}
</nav>
