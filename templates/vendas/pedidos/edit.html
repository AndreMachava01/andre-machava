{% load humanize %}
<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Sistema Conception</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; }
        .container { max-width: 560px; margin: 0 auto; background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .header { border-bottom: 2px solid #10b981; padding-bottom: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: #10b981; margin: 0; font-size: 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
        .btn-primary { background: #10b981; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #374151; font-size: 14px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        .form-row { display: flex; gap: 16px; }
        .form-row .form-group { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-edit"></i> Editar pedido</h1>
            <a href="{% url 'vendas:pedido_detail' ordem.id %}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Voltar</a>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="form-row">
                <div class="form-group">
                    <label for="data_agendada">Data agendada</label>
                    <input type="date" id="data_agendada" name="data_agendada" value="{{ ordem.data_agendada|date:'Y-m-d' }}">
                </div>
                <div class="form-group">
                    <label for="hora_agendada">Hora</label>
                    <input type="time" id="hora_agendada" name="hora_agendada" value="{{ ordem.data_agendada|time:'H:i' }}">
                </div>
            </div>
            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status">
                    {% for value, label in status_choices %}
                        <option value="{{ value }}" {% if ordem.status == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="endereco_servico">Endereço do serviço</label>
                <input type="text" id="endereco_servico" name="endereco_servico" value="{{ ordem.endereco_servico|default:'' }}">
            </div>
            <div class="form-group">
                <label for="cidade_servico">Cidade</label>
                <input type="text" id="cidade_servico" name="cidade_servico" value="{{ ordem.cidade_servico|default:'' }}">
            </div>
            <div class="form-group">
                <label for="equipe">Equipe</label>
                <input type="text" id="equipe" name="equipe" value="{{ ordem.equipe|default:'' }}">
            </div>
            <div class="form-group">
                <label for="responsavel">Responsável</label>
                <select id="responsavel" name="responsavel">
                    <option value="">— Nenhum —</option>
                    {% for u in usuarios %}
                        <option value="{{ u.id }}" {% if ordem.responsavel_id == u.id %}selected{% endif %}>{{ u.get_full_name|default:u.username }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
        </form>
    </div>
</body>
</html>
