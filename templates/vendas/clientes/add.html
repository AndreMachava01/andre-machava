{% load humanize %}
<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Sistema Conception</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header { border-bottom: 2px solid #3b82f6; padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: #3b82f6; margin: 0; font-size: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .required { color: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-user-plus"></i> {{ title }}</h1>
            <a href="{% url 'vendas:clientes_list' %}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Voltar</a>
        </div>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Nome <span class="required">*</span></label>
                <input type="text" name="nome" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email">
            </div>
            <div class="form-group">
                <label>Telefone</label>
                <input type="text" name="telefone">
            </div>
            <div class="form-group">
                <label>NUIT</label>
                <input type="text" name="nuit" maxlength="9">
            </div>
            <div class="form-group">
                <label>Endereço</label>
                <textarea name="endereco" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label>Cidade</label>
                <input type="text" name="cidade">
            </div>
            <div class="form-group">
                <label>Observações</label>
                <textarea name="observacoes" rows="3"></textarea>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 30px;">
                <a href="{% url 'vendas:clientes_list' %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Salvar</button>
            </div>
        </form>
    </div>
</body>
</html>
