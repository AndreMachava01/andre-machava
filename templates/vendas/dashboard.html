{% load humanize %}
<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Sistema Conception</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; }
        .container { max-width: 1400px; margin: 0 auto; background: white; padding: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header { border-bottom: 2px solid #ec4899; padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { color: #ec4899; margin: 0; font-size: 24px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-secondary { background: #6c757d; color: white; }
        .info { text-align: center; padding: 40px; color: #6b7280; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-chart-line"></i> {{ title }}</h1>
            <a href="{% url 'vendas:main' %}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Voltar</a>
        </div>
        <div class="info">
            <i class="fas fa-tools" style="font-size: 48px; margin-bottom: 15px;"></i>
            <p>Funcionalidade em desenvolvimento</p>
        </div>
    </div>
</body>
</html>
