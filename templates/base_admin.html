<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <meta name="description" content="Sistema de Gestão Empresarial - Conception">
    <title>{% block title %}Sistema de Gestão{% endblock %}</title>

    <link rel="icon" type="image/png" href="{% static 'admin/img/icon-yes.svg' %}">
    <link rel="shortcut icon" href="{% static 'admin/img/icon-yes.svg' %}">

    <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/modulo-operacional.css' %}">
    <link rel="stylesheet" href="{% static 'css/forms.css' %}">
    <link rel="stylesheet" href="{% static 'css/tables.css' %}">
    <link rel="stylesheet" href="{% static 'css/modulo-layout-fixes.css' %}">
    <link rel="stylesheet" href="{% static 'css/stock-submodulo.css' %}">
    <link rel="stylesheet" href="{% static 'css/rh-submodulo.css' %}">
    <link rel="stylesheet" href="{% static 'css/stock-legacy-overrides.css' %}">

    {% block extra_style %}{% endblock %}
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="container-fluid">
        {% block content %}
        {% endblock %}
    </div>

    {% block extra_js %}{% endblock %}
</body>
</html>
